<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506781"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="28" y="32" font-family="sans-serif" font-size="22" fill="#152c48">Sion: scoped producers, consumers and lifecycle</text>
<text x="28" y="60" font-family="sans-serif" font-size="15" fill="#53657a">Solid = partial code; dashed = proposed / consumer missing. No live acceptance claimed.</text>
<g transform="translate(0,-2133)"><g id="B28"><title>USB 信任边界；检查设备 ID 和旧配对 ID</title><text x="28" y="2241" font-family="monospace" font-size="16">B28</text><rect x="95" y="2218" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2218" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2240 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2242" font-family="sans-serif" font-size="17">MacPairing</text><text x="775" y="2242" font-family="sans-serif" font-size="17">USBPairing</text><text x="565" y="2231" text-anchor="middle" font-family="sans-serif" font-size="15">device ID / pairing record</text><text x="95" y="2275" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B29"><title>容量拒绝、失败读回、撤销 tombstone；不擦除原 NVS</title><text x="28" y="2320" font-family="monospace" font-size="16">B29</text><rect x="95" y="2297" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2297" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2319 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2321" font-family="sans-serif" font-size="17">USBPairing</text><text x="775" y="2321" font-family="sans-serif" font-size="17">LocalConfig</text><text x="565" y="2310" text-anchor="middle" font-family="sans-serif" font-size="15">two-slot commit / revoke</text><text x="95" y="2354" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B30"><title>Mac HTTPS 客户端验证设备身份并持有模式 epoch</title><text x="28" y="2399" font-family="monospace" font-size="16">B30</text><rect x="95" y="2376" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2376" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2398 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2400" font-family="sans-serif" font-size="17">MacPairing</text><text x="775" y="2400" font-family="sans-serif" font-size="17">ModeClient</text><text x="565" y="2389" text-anchor="middle" font-family="sans-serif" font-size="15">CA / control credential</text><text x="95" y="2433" font-family="sans-serif" font-size="13" fill="#53657a">host-code-tested-device-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B31"><title>P2 语音服务尚未加载 host TLS 配置；不是已有消费者</title><text x="28" y="2478" font-family="monospace" font-size="16">B31</text><rect x="95" y="2455" width="270" height="36" rx="7" fill="#fff2df"/><rect x="760" y="2455" width="290" height="36" rx="7" fill="#fff2df"/><path d="M375,2477 H748" stroke="#506781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="110" y="2479" font-family="sans-serif" font-size="17">MacPairing</text><text x="775" y="2479" font-family="sans-serif" font-size="17">LocalVoiceServer</text><text x="565" y="2468" text-anchor="middle" font-family="sans-serif" font-size="15">host identity / audio credential</text><text x="95" y="2512" font-family="sans-serif" font-size="13" fill="#53657a">proposed</text></g></g>
<g transform="translate(0,-2133)"><g id="B32"><title>本地 WSS 只信任配对主机；原云 trust store 不变</title><text x="28" y="2557" font-family="monospace" font-size="16">B32</text><rect x="95" y="2534" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2534" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2556 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2558" font-family="sans-serif" font-size="17">LocalConfig</text><text x="775" y="2558" font-family="sans-serif" font-size="17">PairedTLS</text><text x="565" y="2547" text-anchor="middle" font-family="sans-serif" font-size="15">pair CA / server name</text><text x="95" y="2591" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B33"><title>只在 original 预约，暂停新的进入；下次主动重启生效</title><text x="28" y="2636" font-family="monospace" font-size="16">B33</text><rect x="95" y="2613" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2613" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2635 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2637" font-family="sans-serif" font-size="17">USBPairing</text><text x="775" y="2637" font-family="sans-serif" font-size="17">DeviceMode</text><text x="565" y="2626" text-anchor="middle" font-family="sans-serif" font-size="15">maintenance reservation</text><text x="95" y="2670" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B34"><title>显式 USB 确认原语音与 App 已现场验证；旧 boot/镜像/缺少确认拒绝</title><text x="28" y="2715" font-family="monospace" font-size="16">B34</text><rect x="95" y="2692" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2692" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2714 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2716" font-family="sans-serif" font-size="17">USBPairing</text><text x="775" y="2716" font-family="sans-serif" font-size="17">FirmwareTrial</text><text x="565" y="2705" text-anchor="middle" font-family="sans-serif" font-size="15">nonce / image / observed check</text><text x="95" y="2749" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B35"><title>唯一确认写入者；超时请求回滚，失败不假报成功；启动器是真机待验消费者</title><text x="28" y="2794" font-family="monospace" font-size="16">B35</text><rect x="95" y="2771" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2771" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2793 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2795" font-family="sans-serif" font-size="17">FirmwareTrial</text><text x="775" y="2795" font-family="sans-serif" font-size="17">OTAMetadata</text><text x="565" y="2784" text-anchor="middle" font-family="sans-serif" font-size="15">confirm / timeout rollback</text><text x="95" y="2828" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
<g transform="translate(0,-2133)"><g id="B36"><title>整个试运行启动期间禁止配对写入/本地模式，确认后仍需主动重启</title><text x="28" y="2873" font-family="monospace" font-size="16">B36</text><rect x="95" y="2850" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="2850" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,2872 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="2874" font-family="sans-serif" font-size="17">FirmwareTrial</text><text x="775" y="2874" font-family="sans-serif" font-size="17">Pairing / ModeControl</text><text x="565" y="2863" text-anchor="middle" font-family="sans-serif" font-size="15">restrict until next reboot</text><text x="95" y="2907" font-family="sans-serif" font-size="13" fill="#53657a">firmware-built-hardware-unverified</text></g></g>
</svg>