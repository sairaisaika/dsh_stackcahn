<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120"><rect width="1120" height="1120" fill="#f6f8fc"/><style>text{font-family:Arial,sans-serif;fill:#18324e}.label{font-size:16px}.note{font-size:14px;fill:#52677d}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52677d"/></marker></defs><text x="28" y="36" font-size="23">Production update paths: what can be overwritten</text><text x="28" y="65" class="note">Source and offline analysis. No device operations. Application OTA exclusion does not protect shared data.</text><text x="28" y="119" font-size="14">U1</text><rect x="70" y="95" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="119" class="label">AI.AGENT startup check</text><path d="M420 114H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="95" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="119" class="label">Next OTA app slot</text><text x="84" y="156" class="note">conditional automatic firmware upgrade</text><text x="28" y="201" font-size="14">U2</text><rect x="70" y="177" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="201" class="label">Setup update action</text><path d="M420 196H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="177" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="201" class="label">Next OTA app slot</text><text x="84" y="238" class="note">manual firmware upgrade</text><text x="28" y="283" font-size="14">U3</text><rect x="70" y="259" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="283" class="label">Device management MCP</text><path d="M420 278H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="259" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="283" class="label">Next OTA app slot</text><text x="84" y="320" class="note">URL install handler; cloud access unverified</text><text x="28" y="365" font-size="14">U4</text><rect x="70" y="341" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="365" class="label">Official App Center</text><path d="M420 360H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="341" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="365" class="label">Next OTA app slot</text><text x="84" y="402" class="note">HTTPS OTA default staging / boot selection</text><text x="28" y="447" font-size="14">U5</text><rect x="70" y="423" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="447" class="label">Original OTA / service response</text><path d="M420 442H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="423" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="447" class="label">Shared MQTT / WS configuration</text><text x="84" y="484" class="note">credential refresh is coupled to version check</text><text x="28" y="529" font-size="14">U6</text><rect x="70" y="505" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="529" class="label">Asset URL + startup resource check</text><path d="M420 524H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="505" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="529" class="label">Shared assets partition</text><text x="84" y="566" class="note">model / font data may change independently</text><text x="28" y="611" font-size="14">U7</text><rect x="70" y="587" width="340" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="611" class="label">OTA writers + running application</text><path d="M420 606H675" stroke="#52677d" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="587" width="400" height="38" rx="8" fill="#e0ebfb"/><text x="704" y="611" class="label">otadata / bootloader selection</text><text x="84" y="648" class="note">selected slot changes; official is not always ota_1</text><text x="28" y="693" font-si