<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#506781"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="28" y="32" font-family="sans-serif" font-size="22" fill="#152c48">Sion: scoped producers, consumers and lifecycle</text>
<text x="28" y="60" font-family="sans-serif" font-size="15" fill="#53657a">Solid = partial code; dashed = proposed / consumer missing. No live acceptance claimed.</text>
<g transform="translate(0,-17775)"><g id="MO3"><title>Settings Motion applies local permission. Explicit guarded Save persists bit 3 of v3 in sion_cfg.</title><text x="28" y="17883" font-family="monospace" font-size="16">MO3</text><rect x="95" y="17860" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="17860" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,17882 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="17884" font-family="sans-serif" font-size="17">Device motion settings</text><text x="775" y="17884" font-family="sans-serif" font-size="17">MotionEngine</text><text x="565" y="17873" text-anchor="middle" font-family="sans-serif" font-size="15">local permission / persistence</text><text x="95" y="17917" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO4"><title>On active authenticated boot/epoch, move_head starts one engine ticket; cancel_move identifies the same request.</title><text x="28" y="17962" font-family="monospace" font-size="16">MO4</text><rect x="95" y="17939" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="17939" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,17961 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="17963" font-family="sans-serif" font-size="17">Authenticated AgentSession</text><text x="775" y="17963" font-family="sans-serif" font-size="17">MotionEngine</text><text x="565" y="17952" text-anchor="middle" font-family="sans-serif" font-size="15">lease / version / request correlation</text><text x="95" y="17996" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO5"><title>DeviceEffects now fences motion and waits for actual MotionEngine Stopped; UI fixture exercises delayed and failed Home.</title><text x="28" y="18041" font-family="monospace" font-size="16">MO5</text><rect x="95" y="18018" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18018" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18040 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18042" font-family="sans-serif" font-size="17">Device lifecycle</text><text x="775" y="18042" font-family="sans-serif" font-size="17">MotionEngine</text><text x="565" y="18031" text-anchor="middle" font-family="sans-serif" font-size="15">Stop / Home / disconnect fence and drain</text><text x="95" y="18075" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO6"><title>Report only after both-axis feedback and release; Host validates request, epoch and final chosen DSH session.</title><text x="28" y="18120" font-family="monospace" font-size="16">MO6</text><rect x="95" y="18097" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18097" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18119 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18121" font-family="sans-serif" font-size="17">MotionOutcome</text><text x="775" y="18121" font-family="sans-serif" font-size="17">AgentConnection / VoiceRuntime</text><text x="565" y="18110" text-anchor="middle" font-family="sans-serif" font-size="15">current epoch result / invalidate late result</text><text x="95" y="18154" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO7"><title>stackchan_move_head uses DSH native permissions, frozen session ID and current voice revision.</title><text x="28" y="18199" font-family="monospace" font-size="16">MO7</text><rect x="95" y="18176" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18176" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18198 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18200" font-family="sans-serif" font-size="17">DSH native motion tool</text><text x="775" y="18200" font-family="sans-serif" font-size="17">VoiceRuntime</text><text x="565" y="18189" text-anchor="middle" font-family="sans-serif" font-size="15">original permissions / chosen session</text><text x="95" y="18233" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO8"><title>Panel reads local engine phase; owner Remote projects bounded motion_state with 6-second freshness. Observed position only in results.</title><text x="28" y="18278" font-family="monospace" font-size="16">MO8</text><rect x="95" y="18255" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18255" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18277 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18279" font-family="sans-serif" font-size="17">Motion status</text><text x="775" y="18279" font-family="sans-serif" font-size="17">Device settings / DSH Remote</text><text x="565" y="18268" text-anchor="middle" font-family="sans-serif" font-size="15">permission / phase / freshness</text><text x="95" y="18312" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO9"><title>core-implemented-runtime-unverified</title><text x="28" y="18357" font-family="monospace" font-size="16">MO9</text><rect x="95" y="18334" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18334" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18356 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18358" font-family="sans-serif" font-size="17">ScsMotionPort</text><text x="775" y="18358" font-family="sans-serif" font-size="17">Pinned SCS codec</text><text x="565" y="18347" text-anchor="middle" font-family="sans-serif" font-size="15">checked status / endian register bytes</text><text x="95" y="18391" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO10"><title>Read-only calibration, staged UART and checked PY32 power now assembled; hardware remains unverified.</title><text x="28" y="18436" font-family="monospace" font-size="16">MO10</text><rect x="95" y="18413" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18413" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18435 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18437" font-family="sans-serif" font-size="17">ServoLink</text><text x="775" y="18437" font-family="sans-serif" font-size="17">Board calibration / UART / power</text><text x="565" y="18426" text-anchor="middle" font-family="sans-serif" font-size="15">read-only calibration / ownership / Healthy</text><text x="95" y="18470" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
<g transform="translate(0,-17775)"><g id="MO11"><title>core-implemented-runtime-unverified</title><text x="28" y="18515" font-family="monospace" font-size="16">MO11</text><rect x="95" y="18492" width="270" height="36" rx="7" fill="#e0ecfa"/><rect x="760" y="18492" width="290" height="36" rx="7" fill="#e0ecfa"/><path d="M375,18514 H748" stroke="#506781" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="18516" font-family="sans-serif" font-size="17">SCS feedback and release</text><text x="775" y="18516" font-family="sans-serif" font-size="17">MotionEngine</text><text x="565" y="18505" text-anchor="middle" font-family="sans-serif" font-size="15">fresh paired pose / checked torque-off</text><text x="95" y="18549" font-family="sans-serif" font-size="13" fill="#53657a">core-implemented-runtime-unverified</text></g></g>
</svg>