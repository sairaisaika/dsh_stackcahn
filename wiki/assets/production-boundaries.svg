<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120"><rect width="1120" height="1120" fill="#f6f8fc"/><style>text{font-family:Arial,sans-serif;fill:#18324e}.id{font-size:14px}.label{font-size:16px}.note{font-size:14px;fill:#52677d}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52677d"/></marker></defs><text x="28" y="36" font-size="23">Production v1.6.2: scoped extension boundaries</text><text x="28" y="65" class="note">Source / offline evidence only. Apps are separate modes. No Sion runtime acceptance claimed.</text><text x="28" y="119" class="id">S1</text><rect x="70" y="95" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="119" class="label">Original cloud assistant</text><path d="M410 114H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" /><rect x="695" y="95" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="119" class="label">Mac MCP / DSH</text><text x="84" y="156" class="note">tool request / result; cloud owns routing</text><text x="28" y="201" class="id">S2</text><rect x="70" y="177" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="201" class="label">Mac BLE client</text><path d="M410 196H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" /><rect x="695" y="177" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="201" class="label">Factory DANCE</text><text x="84" y="238" class="note">face / motion / LEDs; no audio path</text><text x="28" y="283" class="id">S3</text><rect x="70" y="259" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="283" class="label">Phone / authorized LAN peer</text><path d="M410 278H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" /><rect x="695" y="259" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="283" class="label">Factory AVATAR</text><text x="84" y="320" class="note">control / camera session; pairing required</text><text x="28" y="365" class="id">S4</text><rect x="70" y="341" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="365" class="label">AVATAR audio message types</text><path d="M410 360H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4" /><rect x="695" y="341" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="365" class="label">Mac continuous audio</text><text x="84" y="402" class="note">declared, but no implemented duplex handler</text><text x="28" y="447" class="id">S5</text><rect x="70" y="423" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="447" class="label">Cloud camera tool request</text><path d="M410 442H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" /><rect x="695" y="423" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="447" class="label">Factory AI.AGENT</text><text x="84" y="484" class="note">capture / explain; not a Mac video feed</text><text x="28" y="529" class="id">S6</text><rect x="70" y="505" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="529" class="label">Official app catalog</text><path d="M410 524H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" /><rect x="695" y="505" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="529" class="label">Alternate OTA application slot</text><text x="84" y="566" class="note">firmware installation; not a loaded plugin</text><text x="28" y="611" class="id">S7</text><rect x="70" y="587" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="611" class="label">Mic + compiled wake engine</text><path d="M410 606H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" /><rect x="695" y="587" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="611" class="label">Factory AI.AGENT</text><text x="84" y="648" class="note">wake model != displayed device name</text><text x="28" y="693" class="id">S8</text><rect x="70" y="669" width="330" height="38" rx="8" fill="#e0ebfb"/><text x="84" y="693" class="label">USB / Grove / microSD</text><path d="M410 688H680" stroke="#52677d" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4" /><rect x="695" y="669" width="395" height="38" rx="8" fill="#e0ebfb"/><text x="709" y="693" class="label">Mac continuous audio</text><text x="84" y="730" class="note">hardware ports != an implemented protocol</text></svg>